name: Snapshot signatories

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (verspätet sich unter Last)
  workflow_dispatch:          # Button "Run workflow" im Actions-Tab

permissions:
  contents: write

concurrency:
  group: signatories-snapshot
  cancel-in-progress: false

env:
  API: "https://script.google.com/macros/s/AKfycbxg5NLRV13O8P3k2VYaxJLTwO3FUNpxPG9T7-rB-rBX-QYUOw9hHa61ozLSReMFUXnyvw/exec"
  OUT: "signatories.json"     # ggf. "docs/signatories.json"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch list from Apps Script
        run: |
          set -euo pipefail

          if ! curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
                    --max-time 60 "${API}?action=list" -o tmp.json; then
            echo "::error::Abruf fehlgeschlagen. Antwort der URL:"
            curl -sL --max-time 30 "${API}?action=list" | head -c 800 || true
            exit 1
          fi

          echo "Empfangen: $(wc -c < tmp.json) Bytes"

          if head -c 1 tmp.json | grep -q '<'; then
            echo "::error::HTML statt JSON erhalten - Web-App vermutlich nicht auf 'Anyone' freigegeben."
            head -c 800 tmp.json
            exit 1
          fi

      - name: Validate and write snapshot
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"

          python3 - <<'PY'
          import json, os, sys

          new = json.load(open("tmp.json", encoding="utf-8"))
          assert new.get("ok") is True, new
          sigs = new.get("signatories")
          assert isinstance(sigs, list), new

          # Plausibilitaet: count muss zur Liste passen
          if new.get("count") is not None and new["count"] != len(sigs):
              print(f"::warning::count={new['count']} != {len(sigs)} Eintraege")

          # Keine E-Mail-Adressen o.ae. im oeffentlichen Snapshot
          allowed = {"name", "affiliation", "orcid", "since"}
          leaked = set()
          for s in sigs:
              leaked |= set(s) - allowed
          if leaked:
              print(f"::error::Unerwartete Felder im Payload: {sorted(leaked)}")
              sys.exit(1)

          out = os.environ["OUT"]
          old = {}
          if os.path.exists(out):
              try:
                  old = json.load(open(out, encoding="utf-8"))
              except Exception:
                  pass

          # Zeitstempel nur bewegen, wenn sich die Liste wirklich geaendert hat,
          # sonst gaebe es 48 leere Commits pro Tag.
          if old.get("signatories") == sigs and "updated" in old:
              new["updated"] = old["updated"]

          with open(out, "w", encoding="utf-8") as f:
              json.dump(new, f, ensure_ascii=False, indent=1, sort_keys=True)
              f.write("\n")

          print(f"OK: {len(sigs)} Eintraege -> {out}")
          PY

          rm -f tmp.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT"

          if git diff --cached --quiet; then
            echo "Keine Änderung - nichts zu committen."
            exit 0
          fi

          git commit -m "chore: update signatories"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push fehlgeschlagen, rebase und erneut versuchen ($i/3)"
            git pull --rebase --autostash
          done
          exit 1
